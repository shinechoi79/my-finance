//  순수 SVG 차트 컴포넌트 (외부 라이브러리 의존성 없음)
// ════════════════════════════════════════════════════════════════

// 영역 그래프 (대시보드 평가액 추이, 배당금 추이)
function SimpleAreaChart({ data, dataKey, color, height = 140, formatY, t }) {
  const W = 320, H = height, PAD = 28;
  const values = data.map(d => Number(d[dataKey]) || 0);
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const stepX = (W - PAD * 2) / Math.max(data.length - 1, 1);

  const points = data.map((d, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - ((Number(d[dataKey]) - min) / range) * (H - PAD * 2);
    return [x, y];
  });

  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");
  const areaPath = `${linePath} L${points[points.length - 1][0]},${H - PAD} L${points[0][0]},${H - PAD} Z`;

  const [hover, setHover] = useState(null);
  const gradId = "grad_" + dataKey + "_" + Math.random().toString(36).slice(2, 7);

  return (
    <div style={{ position: "relative" }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={color} stopOpacity={0.35} />
            <stop offset="95%" stopColor={color} stopOpacity={0} />
          </linearGradient>
        </defs>
        {/* 가로 그리드 라인 3개 */}
        {[0.25, 0.5, 0.75].map((f, i) => (
          <line key={i} x1={PAD} x2={W - PAD} y1={PAD + f * (H - PAD * 2)} y2={PAD + f * (H - PAD * 2)} stroke={t.border} strokeDasharray="3 3" strokeWidth="1" />
        ))}
        <path d={areaPath} fill={`url(#${gradId})`} />
        <path d={linePath} fill="none" stroke={color} strokeWidth="2" />
        {points.map((p, i) => (
          <circle key={i} cx={p[0]} cy={p[1]} r={hover === i ? 4 : 0}
            fill={color} stroke={t.bg} strokeWidth="1.5"
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            style={{ cursor: "pointer" }} />
        ))}
        {points.map((p, i) => (
          <rect key={"hit" + i} x={p[0] - stepX / 2} y={PAD} width={stepX} height={H - PAD * 2}
            fill="transparent"
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />
        ))}
        {data.map((d, i) => {
          // 데이터가 많으면 라벨 솎아내기 (최대 6개 표시)
          const step = Math.max(1, Math.ceil(data.length / 6));
          if (data.length > 7 && i % step !== 0 && i !== data.length - 1) return null;
          return (
            <text key={i} x={points[i][0]} y={H - 8} fontSize="9" fill={t.textFaint} textAnchor="middle">
              {d.month || d.label}
            </text>
          );
        })}
      </svg>
      {hover !== null && (
        <div style={{
          position: "absolute", left: `${(points[hover][0] / W) * 100}%`, top: 0,
          transform: "translateX(-50%)", background: t.bg, border: `1px solid ${t.border}`,
          borderRadius: 6, padding: "4px 8px", fontSize: 10, color: t.text, whiteSpace: "nowrap", pointerEvents: "none"
        }}>
          {formatY ? formatY(data[hover][dataKey]) : data[hover][dataKey]}
        </div>
      )}
    </div>
  );
}

// 멀티 라인 그래프 (분할매수 회차별, 시뮬레이터 시나리오 비교)
function SimpleLineChart({ data, lines, height = 200, formatY, t, showLegend }) {
  const W = 320, H = height, PAD = 28;
  const allValues = data.flatMap(d => lines.map(l => Number(d[l.key]) || 0));
  const max = Math.max(...allValues, 1);
  const min = Math.min(...allValues, 0);
  const range = max - min || 1;
  const stepX = (W - PAD * 2) / Math.max(data.length - 1, 1);

  const [hover, setHover] = useState(null);

  const getPoints = (key) => data.map((d, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - ((Number(d[key]) - min) / range) * (H - PAD * 2);
    return [x, y];
  });

  return (
    <div>
      <div style={{ position: "relative" }}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
          {[0.25, 0.5, 0.75].map((f, i) => (
            <line key={i} x1={PAD} x2={W - PAD} y1={PAD + f * (H - PAD * 2)} y2={PAD + f * (H - PAD * 2)} stroke={t.border} strokeDasharray="3 3" strokeWidth="1" />
          ))}
          {lines.map((l, li) => {
            const pts = getPoints(l.key);
            const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");
            return (
              <g key={l.key}>
                <path d={path} fill="none" stroke={l.color} strokeWidth="2" strokeDasharray={l.dashed ? "4 4" : "0"} />
                {!l.dashed && pts.map((p, i) => (
                  <circle key={i} cx={p[0]} cy={p[1]} r={hover === i ? 3.5 : 2.5} fill={l.color} />
                ))}
              </g>
            );
          })}
          {data.map((d, i) => {
            const x = PAD + i * stepX;
            return <rect key={i} x={x - stepX / 2} y={0} width={stepX} height={H} fill="transparent"
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} />;
          })}
          {data.map((d, i) => {
            if (data.length > 8 && i % 2 !== 0) return null;
            const x = PAD + i * stepX;
            return (
              <text key={i} x={x} y={H - 6} fontSize="8" fill={t.textFaint} textAnchor="middle">
                {d.round || d.year}
              </text>
            );
          })}
        </svg>
        {hover !== null && (
          <div style={{
            position: "absolute", left: `${(PAD + hover * stepX) / W * 100}%`, top: 0,
            transform: "translateX(-50%)", background: t.bg, border: `1px solid ${t.border}`,
            borderRadius: 6, padding: "6px 10px", fontSize: 10, color: t.text, whiteSpace: "nowrap", pointerEvents: "none", zIndex: 10
          }}>
            {lines.map(l => (
              <div key={l.key} style={{ color: l.color }}>
                {l.label}: {formatY ? formatY(data[hover][l.key]) : data[hover][l.key]}
              </div>
            ))}
          </div>
        )}
      </div>
      {showLegend && (
        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 8, flexWrap: "wrap" }}>
          {lines.filter(l => !l.dashed).map(l => (
            <div key={l.key} style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <div style={{ width: 8, height: 8, borderRadius: 2, background: l.color }} />
              <span style={{ fontSize: 10, color: t.textSub }}>{l.label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// 도넛 파이 차트 (자산배분)
function SimpleDonut({ data, colors, size = 120 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = size / 2;
  const innerR = r * 0.55;
  let cumAngle = -90;

  const arcs = data.map((d, i) => {
    const angle = (d.value / total) * 360;
    const startAngle = cumAngle;
    const endAngle = cumAngle + angle;
    cumAngle = endAngle;

    const toXY = (ang, radius) => {
      const rad = (ang * Math.PI) / 180;
      return [r + radius * Math.cos(rad), r + radius * Math.sin(rad)];
    };

    const [x1, y1] = toXY(startAngle, r);
    const [x2, y2] = toXY(endAngle, r);
    const [ix1, iy1] = toXY(endAngle, innerR);
    const [ix2, iy2] = toXY(startAngle, innerR);
    const largeArc = angle > 180 ? 1 : 0;

    const path = `M${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} L${ix1},${iy1} A${innerR},${innerR} 0 ${largeArc} 0 ${ix2},${iy2} Z`;
    return <path key={i} d={path} fill={colors[i % colors.length]} />;
  });

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {arcs}
    </svg>
  );
}

function jsonpGet(url, action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = "__dc_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const qs = new URLSearchParams({ action, callback: cbName, ...params }).toString();
    const script = document.createElement("script");
    script.src = `${url}?${qs}`;

    const cleanup = () => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    window[cbName] = (json) => {
      cleanup();
      if (json && json.success) resolve(json.data);
      else reject(new Error(json?.error || "알 수 없는 오류"));
    };
    script.onerror = () => { cleanup(); reject(new Error("스크립트 로드 실패 — URL 또는 배포 설정 확인")); };

    document.body.appendChild(script);
    setTimeout(() => {
      if (window[cbName]) { cleanup(); reject(new Error("요청 시간 초과 (25초)")); }
    }, 25000);
  });
}

async function postAction(url, action, data) {
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, data }),
    });
    return true;
  } catch (e) {
    throw new Error("전송 실패: " + e.message);
  }
}

const fmt = (n) => new Intl.NumberFormat("ko-KR").format(Math.round(Number(n) || 0));
// 축약 표기 규칙 통일
//  1억 이상  → 1.38억
//  1만 이상  → 1,152만
//  그 미만   → 5,270
const fmtM = (n) => {
  const v = Math.round(Number(n || 0));
  const abs = Math.abs(v);
  const sign = v < 0 ? "-" : "";
  if (abs >= 100000000) return `${sign}${(abs / 100000000).toFixed(2)}억`;
  if (abs >= 10000) return `${sign}${Math.round(abs / 10000).toLocaleString("ko-KR")}만`;
  return `${sign}${new Intl.NumberFormat("ko-KR").format(abs)}`;
};
const pct = (n) => `${Number(n) >= 0 ? "+" : ""}${Number(n || 0).toFixed(2)}%`;
const fmtDate = (d) => {
  if (!d) return "-";
  const s = String(d);
  // ISO 포맷 (2026-08-03T15:00:00.000Z) → 2026-08-03
  if (s.includes("T")) return s.slice(0, 10);
  // Date 객체
  if (s.includes("/")) {
    const dt = new Date(d);
    if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
  }
  return s.slice(0, 10);
};

function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");
  useEffect(() => { localStorage.setItem(THEME_KEY, theme); }, [theme]);
  const toggle = () => setTheme(t => t === "dark" ? "light" : "dark");
  return [theme, toggle];
}

  const loadAll = useCallback(async (opts = {}) => {
    if (!apiUrl) return;
    const silent = !!opts.silent;
    if (!silent) setLoading(true);
    setError(null);
    try {
      // 단일 호출로 전체 데이터 수신 (bootstrap)
      let all;
      try {
        all = await jsonpGet(apiUrl, "bootstrap");
      } catch (e) {
        // bootstrap 실패 시 폴백: 3개를 병렬로 호출 (순차 대기 제거)
        const [rAll, rPension, rHistory] = await Promise.allSettled([
          jsonpGet(apiUrl, "all"),
          jsonpGet(apiUrl, "pension"),
          jsonpGet(apiUrl, "history"),
        ]);
        if (rAll.status !== "fulfilled") throw rAll.reason || e;
        all = rAll.value;
        all.pension = rPension.status === "fulfilled" ? rPension.value : null;
        all.history = rHistory.status === "fulfilled" ? rHistory.value : [];
      }

      // 연금 데이터가 비었는데 캐시에 있으면 캐시 값을 유지 (부분 유실 방지)
      if (!all.pension || !(all.pension.accounts || []).length) {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          const cached = raw ? JSON.parse(raw) : null;
          if (cached?.data?.pension?.accounts?.length) {
            all.pension = cached.data.pension;
            all._pensionFromCache = true;
          }
        } catch(_) {}
      }
      if (!(all.history || []).length) {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          const cached = raw ? JSON.parse(raw) : null;
          if (cached?.data?.history?.length) all.history = cached.data.history;
        } catch(_) {}
      }

      setData(all);
      setLastSync(new Date());
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: all }));
      } catch(_) {}
    } catch (e) {
      // 갱신 실패해도 캐시가 화면에 남아있으면 에러 배너만 표시
      setError(e.message);
    }
    if (!silent) setLoading(false);
  }, [apiUrl]);

  // 최초 진입: 캐시 즉시 표시 → 백그라운드 갱신
  // (캐시가 10분 이상 오래되면 로딩 표시를 하면서 갱신)
  const bootedRef = useRef(false);
  useEffect(() => {
    if (!apiUrl || bootedRef.current) return;
    bootedRef.current = true;

    const CACHE_TTL = 10 * 60 * 1000; // 10분
    let fresh = false;
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        const cached = JSON.parse(raw);
        if (cached && cached.data) {
          setData(cached.data);
          setLastSync(new Date(cached.at));
          fresh = (Date.now() - Number(cached.at)) < CACHE_TTL;
        }
      }
    } catch(_) {}

    // 캐시가 신선하면 조용히, 오래됐거나 없으면 로딩 표시하며 갱신
    loadAll({ silent: fresh });
  }, [apiUrl, loadAll]);

  const saveApiUrl = (url) => {
    localStorage.setItem(API_URL_KEY, url);
    setApiUrl(url);
    setShowSetup(false);
  };

  // ── 공통 액션 실행기 (POST 후 재로딩) ────────────────────────
  const runAction = useCallback(async (action, payload, successMsg) => {
    try {
      await postAction(apiUrl, action, payload);
      showToast(successMsg || "저장되었습니다 (화면은 잠시 후 갱신)");
      // POST 완료 즉시 반환 → 저장 중... 상태 즉시 해제
      // 재조회는 백그라운드에서 2초 후 실행
      setTimeout(() => loadAll({ silent: true }), 2000);
      return true;
    } catch (e) {
      showToast(e.message, "error");
      return false;
    }
  }, [apiUrl, loadAll, showToast]);

  // ── 초기 설정 화면 ────────────────────────────────────────────
  if (showSetup || !apiUrl) {
    return <SetupScreen theme={t} onSave={saveApiUrl} initial={apiUrl} onCancel={() => setShowSetup(false)} />;
  }

  // 보유 종목(머니파킹/현금 제외)과 전체 계산
  const portfolio = data?.portfolio || [];
  const realProducts = portfolio.filter(p => p.is_parking !== true && p.is_parking !== "TRUE");
  const totalValue = portfolio.reduce((s, p) => s + (Number(p.eval_amount) || 0), 0);
  const totalCost = portfolio.reduce((s, p) => s + (Number(p.purchase_cost) || 0), 0);
  // 전체 연금 자산 (DC + 연금저축 + IRP)
  const pensionData = data?.pension;
  const pAccounts = pensionData?.accounts || [];
  const savingsAcc = pAccounts.find(a => a.account === "연금저축");
  const irpAcc = pAccounts.find(a => a.account === "개인형IRP");
  const savingsEval = Number(savingsAcc?.eval_amount) || 0;
  const irpEval = Number(irpAcc?.eval_amount) || 0;
  const totalAllEval = totalValue + savingsEval + irpEval;
  const savingsCost = Number(savingsAcc?.purchase_cost) || 0;
  const irpCost = Number(irpAcc?.purchase_cost) || 0;
  const totalAllCost = totalCost + savingsCost + irpCost;

  return (
    <div style={{ fontFamily: "'Pretendard', 'Apple SD Gothic Neo', sans-serif", background: t.bg, minHeight: "100vh", color: t.text, maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 80, transition: "background 0.3s, color 0.3s" }}>

      {/* 헤더 */}
      {(() => {
        const gain = totalAllEval - totalAllCost;
        const gainPct = totalAllCost > 0 ? (gain / totalAllCost) * 100 : 0;
        const isUp = gain >= 0;
        return (
          <div style={{ background: t.bgGradient, padding: "22px 20px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: "#8A94A6", marginBottom: 8 }}>전체 연금 자산</div>
                <div style={{ fontSize: 32, fontWeight: 800, color: "#FFFFFF", letterSpacing: "-0.5px", lineHeight: 1.1 }}>
                  ₩{fmt(totalAllEval)}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
                  <span style={{
                    fontSize: 12, fontWeight: 700,
                    color: isUp ? "#FCA5B5" : "#93C5FD",
                    background: isUp ? "#3B1521" : "#152E52",
                    padding: "3px 9px", borderRadius: 6,
                  }}>
                    {isUp ? "▲" : "▼"} {Math.abs(gainPct).toFixed(2)}%
                  </span>
                  <span style={{ fontSize: 12, color: "#8A94A6" }}>
                    {isUp ? "+" : "-"}₩{fmt(Math.abs(gain))}
                  </span>
                </div>
                <div style={{ fontSize: 11, color: "#5A6376", marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}>
                  <span>투자 원금 ₩{fmt(totalAllCost)}</span>
                  {loading && data && (
                    <span style={{ fontSize: 10, color: "#8A94A6" }}>· 갱신 중…</span>
                  )}
                  {!loading && lastSync && (
                    <span style={{ fontSize: 10, color: "#5A6376" }}>
                      · {new Date(lastSync).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })} 기준
                    </span>
                  )}
                </div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={toggleTheme} style={headerBtnStyle()}><Icon name={theme === "dark" ? "sun" : "moon"} size={17} color="#C8D0DC" /></button>
                <button onClick={() => loadAll()} style={headerBtnStyle()} disabled={loading}>
                  <div style={{ animation: loading ? "dcSpin 1s linear infinite" : "none" }}>
                    <Icon name="refresh" size={17} color="#C8D0DC" />
                  </div>
                </button>
                <button onClick={() => setShowSetup(true)} style={headerBtnStyle()}><Icon name="settings" size={17} color="#C8D0DC" /></button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* 에러 배너 — 캐시가 있으면 톤 다운, 없으면 강조 */}
      {error && (
        data ? (
          <div style={{ margin: "12px 16px 0", padding: "10px 14px", background: t.inputBg, borderRadius: 10, border: `1px solid ${t.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 11, color: t.textSub, fontWeight: 600 }}>최신 데이터를 불러오지 못했어요</div>
              <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>
                마지막으로 받은 정보를 표시 중입니다
              </div>
            </div>
            <button onClick={() => loadAll()} style={{ ...btnStyle(t.border), padding: "5px 12px", fontSize: 11, color: t.text }}>다시 시도</button>
          </div>
        ) : (
          <div style={{ margin: 16, padding: "12px 14px", background: t.downBg, borderRadius: 10, fontSize: 12, color: t.down, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span>데이터를 불러오지 못했어요: {error}</span>
            <button onClick={() => loadAll()} style={{ ...btnStyle(t.down), padding: "4px 10px", fontSize: 11 }}>재시도</button>
          </div>
        )
      )}

      {/* 로딩 (캐시가 없는 최초 진입에만 표시) */}
      {loading && !data && (
        <div style={{ padding: "50px 24px", textAlign: "center" }}>
          <div style={{ fontSize: 13, color: t.textSub, marginBottom: 8 }}>데이터를 불러오는 중입니다</div>
          <div style={{ fontSize: 11, color: t.textFaint }}>최초 실행은 몇 초 걸릴 수 있어요</div>
          <div style={{ marginTop: 20, height: 3, background: t.border, borderRadius: 2, overflow: "hidden" }}>
            <div style={{
              height: "100%", width: "40%", background: t.textMuted, borderRadius: 2,
              animation: "dcLoadingBar 1.2s ease-in-out infinite",
            }} />
          </div>
        </div>
      )}

      {/* 탭 콘텐츠 */}
      {data && (
        <div style={{ padding: "0 0 20px" }}>
          {tab === "dashboard" && <Dashboard t={t} theme={theme} data={data} totalValue={totalValue} totalCost={totalCost} savingsEval={savingsEval} irpEval={irpEval} savingsCost={savingsCost} irpCost={irpCost} totalAllEval={totalAllEval} totalAllCost={totalAllCost} setTab={setTab} runAction={runAction} />}
          {tab === "dc" && (
            <div>
              {/* DC 요약 카드 */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, padding: "16px 16px 0" }}>
                {[
                  { label: "분할매수 진행", value: `${Number(data.summary.dca_done)||0}/${Number(data.summary.dca_total)||12}회`, sub: "6개월 12회", color: "#60A5FA" },
                  { label: "배당금 수령", value: `₩${fmtM(data.summary.total_dividend)}`, sub: "누적", color: "#34D399" },
                  { label: "DC 투자원금", value: `₩${fmtM(totalCost)}`, sub: "원금기준", color: "#F59E0B" },
                  { label: "DC 평가수익", value: pct(totalCost > 0 ? ((totalValue - totalCost) / totalCost) * 100 : 0), sub: `₩${fmtM(totalValue - totalCost)}`, color: (totalValue - totalCost) >= 0 ? t.up : t.down },
                ].map((cd, i) => (
                  <div key={i} style={{ background: t.card, borderRadius: 12, padding: 14, border: `1px solid ${t.border}` }}>
                    <div style={{ fontSize: 11, color: t.textMuted, marginBottom: 4 }}>{cd.label}</div>
                    <div style={{ fontSize: 22, fontWeight: 700, color: cd.color }}>{cd.value}</div>
                    <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>{cd.sub}</div>
                  </div>
                ))}
              </div>
              {/* DC 서브탭 */}
              <div style={{ display: "flex", gap: 6, padding: "12px 16px 0", overflowX: "auto" }}>
                {DC_SUBTABS.map(st => (
                  <button key={st.id} onClick={() => setDcSubtab(st.id)}
                    style={{
                      padding: "7px 14px", borderRadius: 20, border: "none", whiteSpace: "nowrap",
                      background: dcSubtab === st.id ? "#3B82F6" : t.card,
                      color: dcSubtab === st.id ? "#fff" : t.textSub,
                      fontSize: 12, fontWeight: dcSubtab === st.id ? 700 : 500, cursor: "pointer",
                    }}>{st.label}</button>
                ))}
              </div>
              {dcSubtab === "portfolio" && <Portfolio t={t} data={data} totalValue={totalValue} apiUrl={apiUrl} runAction={runAction} />}
              {dcSubtab === "dca" && <DCA t={t} data={data} apiUrl={apiUrl} runAction={runAction} />}
              {dcSubtab === "contributions" && <Contributions t={t} data={data} apiUrl={apiUrl} runAction={runAction} />}
              {dcSubtab === "dividends" && <Dividends t={t} data={data} apiUrl={apiUrl} runAction={runAction} />}
            </div>
          )}
          {tab === "savings" && <PensionAccounts t={t} data={data} apiUrl={apiUrl} runAction={runAction} showToast={showToast} onlyAccount="연금저축" />}
          {tab === "irp" && <PensionAccounts t={t} data={data} apiUrl={apiUrl} runAction={runAction} showToast={showToast} onlyAccount="개인형IRP" />}
          {tab === "simulator" && <Simulator t={t} data={data} totalValue={totalAllEval} apiUrl={apiUrl} runAction={runAction} showToast={showToast} />}
        </div>
      )}

      {/* 토스트 */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 90, left: "50%", transform: "translateX(-50%)",
          background: toast.type === "error" ? "#450A0A" : "#064E3B",
          color: toast.type === "error" ? "#F87171" : "#34D399",
          padding: "10px 18px", borderRadius: 10, fontSize: 12, fontWeight: 600,
          zIndex: 100, maxWidth: 400, textAlign: "center", boxShadow: "0 4px 12px rgba(0,0,0,0.3)"
        }}>
          {toast.msg}
        </div>
      )}

      {/* 하단 탭 바 */}
      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 480, background: t.bg,
        borderTop: `1px solid ${t.border}`, display: "flex",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
      }}>
        {TABS.map(tb => {
          const active = tab === tb.id;
          const col = active ? t.text : t.textFaint;
          return (
            <button key={tb.id} onClick={() => setTab(tb.id)}
              style={{ flex: 1, padding: "8px 0 8px", background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, position: "relative" }}>
              <Icon name={tb.icon} size={20} color={col} strokeWidth={active ? 2 : 1.5} />
              <span style={{ fontSize: 10, color: col, fontWeight: active ? 600 : 400, letterSpacing: "-0.2px" }}>{tb.label}</span>
              {active && <div style={{ position: "absolute", top: 0, width: 24, height: 2, background: t.text, borderRadius: 1 }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  초기 설정 화면
// ════════════════════════════════════════════════════════════════
function SetupScreen({ theme: t, onSave, initial, onCancel }) {
  const [url, setUrl] = useState(initial || "");
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  const test = async () => {
    if (!url.trim()) return;
    setTesting(true);
    setTestResult(null);
    try {
      await jsonpGet(url.trim(), "summary");
      setTestResult({ ok: true, msg: "연동 성공! 저장하고 시작할 수 있어요." });
    } catch (e) {
      setTestResult({ ok: false, msg: e.message });
    }
    setTesting(false);
  };

  return (
    <div style={{ fontFamily: "'Pretendard','Apple SD Gothic Neo',sans-serif", background: t.bg, minHeight: "100vh", color: t.text, maxWidth: 480, margin: "0 auto", padding: 24 }}>
      <div style={{ marginTop: 40, marginBottom: 24, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ fontSize: 11, color: t.textMuted, letterSpacing: 2, marginBottom: 6 }}>DC 퇴직연금 관리</div>
          <div style={{ fontSize: 24, fontWeight: 800, background: "linear-gradient(90deg,#60A5FA,#34D399)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
            초기 설정
          </div>
        </div>
        {onCancel && initial && (
          <button onClick={onCancel} style={{ background: t.card, border: `1px solid ${t.border}`, borderRadius: 8, width: 34, height: 34, fontSize: 14, cursor: "pointer", color: t.text }}>✕</button>
        )}
      </div>

      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 14, border: `1px solid ${t.border}` }}>
        <label style={{ fontSize: 11, color: t.textMuted, display: "block", marginBottom: 6 }}>Apps Script 웹앱 URL</label>
        <input
          value={url}
          onChange={e => setUrl(e.target.value)}
          placeholder="https://script.google.com/macros/s/..."
          style={{ width: "100%", background: t.inputBg, border: `1px solid ${t.border}`, borderRadius: 8, padding: "10px 12px", color: t.text, fontSize: 12, outline: "none", boxSizing: "border-box" }}
        />
      </div>

      {testResult && (
        <div style={{ padding: "10px 14px", borderRadius: 8, marginBottom: 14, fontSize: 12, background: testResult.ok ? "#064E3B" : "#450A0A", color: testResult.ok ? "#34D399" : "#F87171" }}>
          {testResult.ok ? "✅" : "❌"} {testResult.msg}
        </div>
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={test} disabled={testing || !url.trim()} style={btnStyle("#3B82F6")}>
          {testing ? "테스트 중..." : "연결 테스트"}
        </button>
        <button onClick={() => onSave(url.trim())} disabled={!url.trim()} style={btnStyle("#10B981")}>
          저장하고 시작
        </button>
      </div>

      <div style={{ marginTop: 20, padding: 14, background: t.card, borderRadius: 12, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 11, color: "#60A5FA", fontWeight: 700, marginBottom: 8 }}>URL 찾는 방법</div>
        <div style={{ fontSize: 11, color: t.textSub, lineHeight: 1.7 }}>
          Google Sheets → 확장 프로그램 → Apps Script → 배포 → 배포 관리에서<br />
          웹 앱 URL을 복사해서 붙여넣으세요.
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  대시보드
// ════════════════════════════════════════════════════════════════
function Dashboard({ t, theme, data, totalValue, totalCost, savingsEval = 0, irpEval = 0, savingsCost = 0, irpCost = 0, totalAllEval = 0, totalAllCost = 0, setTab, runAction }) {
  const { summary, portfolio, config } = data;
  // 계좌 구분 색 (테마 대응) — 아래 계산들보다 먼저 선언되어야 함
  const AC = ACCT_COLORS[theme === "dark" ? "dark" : "light"];
  const [histFilter, setHistFilter] = useState("total");

  // 현금성 자산 빠른 수정
  const cashRow = (data.portfolio || []).find(p => p.ticker === "CASH");
  const [cashEditing, setCashEditing] = useState(false);
  const [cashValue, setCashValue] = useState("");
  const [cashSaving, setCashSaving] = useState(false);
  // 직전 갱신 기록 (localStorage): { value, at }
  const [cashPrev, setCashPrev] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CASH_LOG_KEY) || "null"); } catch(_) { return null; }
  });
  const saveCash = async () => {
    if (!cashValue || !cashRow) return;
    const newVal = Number(cashValue);
    const oldVal = Number(cashRow.units) || 0;
    setCashSaving(true);
    await runAction("updateHoldings", { ticker: "CASH", units: newVal, avg_cost: 1 }, "현금 잔액 갱신됨");
    // 갱신 시점 기록 (다음 갱신 때 변동 계산용)
    const log = { value: oldVal, at: Date.now() };
    try { localStorage.setItem(CASH_LOG_KEY, JSON.stringify(log)); } catch(_) {}
    setCashPrev(log);
    setCashSaving(false);
    setCashEditing(false);
  };

  // 직전 갱신 대비 변동 계산
  const cashDelta = (() => {
    if (!cashRow || !cashPrev) return null;
    const cur = Number(cashRow.units) || 0;
    const diff = cur - Number(cashPrev.value);
    const days = Math.max(1, Math.round((Date.now() - Number(cashPrev.at)) / 86400000));
    if (diff === 0) return null;
    return { diff, days, perDay: Math.round(diff / days) };
  })();

  // 다음 매수 안내 (마지막 분할매수 이후 경과일)
  const dcaRows = (data.dca || []).filter(d => String(d.source || "").trim() !== "기여금매수");
  const lastDcaDate = dcaRows.length
    ? dcaRows.map(d => fmtDate(d.date)).sort().slice(-1)[0]
    : null;
  const daysSinceDca = lastDcaDate
    ? Math.floor((Date.now() - new Date(lastDcaDate + "T00:00:00").getTime()) / 86400000)
    : null;
  const dcaDoneCnt = Number(summary.dca_done) || 0;
  const dcaTotalCnt = Number(summary.dca_total) || 12;
  const totalReturn = totalCost > 0 ? ((totalValue - totalCost) / totalCost) * 100 : 0;
  const totalDividend = Number(summary.total_dividend) || 0;
  const dcaDone = Number(summary.dca_done) || 0;
  const dcaTotal = Number(summary.dca_total) || 12;

  // 자산 추이 (ASSET_HISTORY 기반)
  const history = data?.history || [];
  // 추이 필터 (전체 / DC / 연금저축 / IRP)
  const HIST_KEYS = {
    total:   { label: "전체",     ev: "total_eval",  cost: "total_cost",  color: AC.dc },
    dc:      { label: "DC",       ev: "dc_eval",     cost: "dc_cost",     color: AC.dc },
    savings: { label: "연금저축", ev: "saving_eval", cost: "saving_cost", color: AC.saving },
    irp:     { label: "IRP",      ev: "irp_eval",    cost: "irp_cost",    color: AC.irp },
  };
  const hk = HIST_KEYS[histFilter] || HIST_KEYS.total;
  const histChart = history.map(h => ({
    month: fmtDate(h.date).slice(5).replace("-", "/"),  // MM/DD
    value: Math.round(Number(h[hk.ev]) || 0),
    cost: Math.round(Number(h[hk.cost]) || 0),
  }));

  // 3계좌 전체 종목 통합 자산배분
  const pensionAccts = data?.pension?.accounts || [];
  const dcItems = portfolio.filter(p => Number(p.eval_amount) > 0)
    .map(p => ({ name: p.name, value: Number(p.eval_amount), acct: "DC" }))
    .sort((a, b) => b.value - a.value);
  const pensionItems = pensionAccts.filter(a => Number(a.eval_amount) > 0)
    .map(a => ({ name: a.name, value: Number(a.eval_amount), acct: a.account }));
  // DC 종목은 남색 계열 명도 단계, 연금저축/IRP는 각 계좌색
  const pieData = [...dcItems, ...pensionItems];
  const pieColors = [
    ...dcItems.map((_, i) => DC_SHADES[i % DC_SHADES.length]),
    ...pensionItems.map(p => p.acct === "연금저축" ? AC.saving : AC.irp),
  ];

  // 3계좌 구성 데이터
  const accountBreakdown = [
    { key: "dc",      label: "DC 퇴직연금", tab: "dc",      ev: totalValue,  cost: totalCost,    color: AC.dc },
    { key: "savings", label: "연금저축",    tab: "savings", ev: savingsEval, cost: savingsCost,  color: AC.saving },
    { key: "irp",     label: "개인형 IRP",  tab: "irp",     ev: irpEval,     cost: irpCost,      color: AC.irp },
  ].filter(a => a.ev > 0 || a.key === "dc");

  const allTotal = totalAllEval || 1;

  return (
    <div style={{ padding: "16px 16px 0" }}>

      {/* ── 다음 매수 안내 ─────────────────────────────── */}
      {dcaDoneCnt < dcaTotalCnt && daysSinceDca !== null && (() => {
        // 6개월 12회 ≒ 15일 간격 기준
        const INTERVAL = 15;
        const due = daysSinceDca >= INTERVAL;
        return (
          <div onClick={() => setTab && setTab("dc")}
            style={{
              background: due ? t.inputBg : t.card, borderRadius: 12, padding: "12px 16px", marginBottom: 12,
              border: `1px solid ${due ? t.textFaint : t.border}`, cursor: "pointer",
              display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: t.text }}>
                {dcaDoneCnt + 1}회차 분할매수 {due ? "진행할 때예요" : "예정"}
              </div>
              <div style={{ fontSize: 10, color: t.textFaint, marginTop: 3 }}>
                마지막 매수 {lastDcaDate} · {daysSinceDca}일 경과
                {!due && ` · ${INTERVAL - daysSinceDca}일 후 권장`}
              </div>
            </div>
            <span style={{ fontSize: 11, color: t.textMuted, fontWeight: 600 }}>
              {dcaDoneCnt}/{dcaTotalCnt}회 ›
            </span>
          </div>
        );
      })()}

      {/* ── 계좌별 구성 ─────────────────────────────────── */}
      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, marginBottom: 14, fontWeight: 600 }}>계좌별 구성</div>

        {/* 누적 비중 바 */}
        <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", marginBottom: 14 }}>
          {accountBreakdown.map(a => (
            <div key={a.key} style={{ width: `${(a.ev / allTotal) * 100}%`, background: a.color }} />
          ))}
        </div>

        {accountBreakdown.map(a => {
          const ret = a.cost > 0 ? ((a.ev - a.cost) / a.cost) * 100 : 0;
          const share = (a.ev / allTotal) * 100;
          return (
            <div key={a.key} onClick={() => setTab && setTab(a.tab)}
              style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${t.border}`, cursor: "pointer" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 10, height: 10, borderRadius: 3, background: a.color }} />
                <div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: t.text }}>{a.label}</div>
                  <div style={{ fontSize: 10, color: t.textFaint }}>{share.toFixed(1)}% · 원금 ₩{fmtM(a.cost)}</div>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: t.text }}>₩{fmt(a.ev)}</div>
                <div style={{ fontSize: 11, color: ret >= 0 ? t.up : t.down }}>{pct(ret)}</div>
              </div>
            </div>
          );
        })}

        {accountBreakdown.length < 3 && (
          <div style={{ marginTop: 10, padding: "8px 10px", background: t.inputBg, borderRadius: 8, fontSize: 10, color: t.textMuted, textAlign: "center" }}>
            연금저축·IRP 정보를 불러오지 못했어요 · 새로고침을 눌러주세요
          </div>
        )}
        <div style={{ fontSize: 10, color: t.textFaint, marginTop: 10, textAlign: "center" }}>
          계좌를 탭하면 상세 화면으로 이동합니다
        </div>
      </div>

      {/* ── 현금성 자산 (이자 반영용 빠른 수정) ─────────────────── */}
      {cashRow && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
          <div style={{ marginBottom: cashEditing ? 12 : 0 }}>
            {/* 1행: 이름 + 수정 버튼 */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 13, color: t.textSub, fontWeight: 600 }}>{cashRow.name}</span>
              {!cashEditing && (
                <button onClick={() => { setCashEditing(true); setCashValue(String(Math.round(Number(cashRow.units) || 0))); }}
                  style={{ ...btnStyle(t.border), padding: "5px 12px", fontSize: 11, color: t.text, whiteSpace: "nowrap" }}>수정</button>
              )}
            </div>
            {/* 2행: 금액 */}
            {!cashEditing && (
              <div style={{ fontSize: 20, fontWeight: 700, color: t.text, fontVariantNumeric: "tabular-nums", marginTop: 6 }}>
                ₩{fmt(cashRow.eval_amount)}
              </div>
            )}
            {/* 3행: 변동 or 안내 */}
            {cashDelta ? (
              <div style={{ fontSize: 10, marginTop: 4 }}>
                <span style={{ color: cashDelta.diff >= 0 ? t.up : t.down, fontWeight: 600 }}>
                  {cashDelta.days}일 전 대비 {cashDelta.diff >= 0 ? "+" : "−"}₩{fmt(Math.abs(cashDelta.diff))}
                </span>
                <span style={{ color: t.textFaint }}> · 일평균 {cashDelta.perDay >= 0 ? "+" : "−"}₩{fmt(Math.abs(cashDelta.perDay))}</span>
              </div>
            ) : (
              <div style={{ fontSize: 10, color: t.textFaint, marginTop: 4 }}>
                매일 이자가 붙으므로 주기적으로 갱신해주세요
              </div>
            )}
          </div>

          {cashEditing && (
            <div>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 4 }}>MTS 기준 현재 잔액 (원)</div>
              <input type="number" value={cashValue} onChange={e => setCashValue(e.target.value)}
                style={{ ...inputStyle(t), fontSize: 15, padding: "10px 12px", marginBottom: 6 }} />
              {cashValue && Number(cashValue) !== Number(cashRow.units) && (
                <div style={{ fontSize: 11, color: Number(cashValue) > Number(cashRow.units) ? t.up : t.down, marginBottom: 10 }}>
                  {Number(cashValue) > Number(cashRow.units) ? "+" : "−"}₩{fmt(Math.abs(Number(cashValue) - Number(cashRow.units)))} 변동
                  <span style={{ color: t.textFaint }}> (직전 ₩{fmt(cashRow.units)})</span>
                </div>
              )}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={saveCash} disabled={cashSaving} style={btnStyle("#10B981")}>
                  {cashSaving ? "저장 중..." : "저장"}
                </button>
                <button onClick={() => setCashEditing(false)} style={btnStyle("#475569")}>취소</button>
              </div>
            </div>
          )}
        </div>
      )}


      {/* ── 자산 추이 (히스토리) ─────────────────────────────── */}
      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span style={{ fontSize: 13, color: t.textSub, fontWeight: 600 }}>자산 추이</span>
          {histChart.length > 1 && (() => {
            const first = histChart[0].value;
            const last = histChart[histChart.length - 1].value;
            const chg = last - first;
            const chgPct = first > 0 ? (chg / first) * 100 : 0;
            const days = histChart.length;
            return (
              <span style={{ display: "flex", alignItems: "baseline", gap: 5 }}>
                <span style={{ fontSize: 10, color: t.textFaint }}>{days}일간</span>
                <span style={{ fontSize: 11, color: chg >= 0 ? t.up : t.down, fontWeight: 700 }}>
                  {chg >= 0 ? "▲" : "▼"} ₩{fmt(Math.abs(chg))} ({pct(chgPct)})
                </span>
              </span>
            );
          })()}
        </div>

        {/* 계좌 필터 */}
        <div style={{ display: "flex", gap: 4, marginBottom: 12 }}>
          {Object.entries(HIST_KEYS).map(([key, v]) => {
            const on = histFilter === key;
            return (
              <button key={key} onClick={() => setHistFilter(key)}
                style={{
                  flex: 1, padding: "5px 0", borderRadius: 6, cursor: "pointer",
                  border: `1px solid ${on ? "transparent" : t.border}`,
                  background: on ? t.textSub : "transparent",
                  color: on ? t.card : t.textMuted,
                  fontSize: 11, fontWeight: on ? 600 : 400,
                }}>{v.label}</button>
            );
          })}
        </div>
        {histChart.length < 2 ? (
          <div style={{ padding: "24px 12px", textAlign: "center" }}>
            <div style={{ fontSize: 11, color: t.textFaint, lineHeight: 1.7 }}>
              아직 추이 데이터가 부족해요<br />
              매일 자동으로 기록되며, 2일 이상 쌓이면 그래프가 표시됩니다
            </div>
            {histChart.length === 1 && (
              <div style={{ fontSize: 10, color: t.textMuted, marginTop: 8 }}>
                현재 {histChart.length}일치 기록됨
              </div>
            )}
          </div>
        ) : (
          <>
            <SimpleAreaChart data={histChart} dataKey="value" color={hk.color} height={150} formatY={v => `₩${fmt(v)}`} t={t} />
            {(() => {
              const last = histChart[histChart.length - 1];
              const gain = last.value - last.cost;
              const gainPct = last.cost > 0 ? (gain / last.cost) * 100 : 0;
              return (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 12, paddingTop: 12, borderTop: `1px solid ${t.border}` }}>
                  <Stat t={t} label="현재 평가액" value={`₩${fmtM(last.value)}`} />
                  <Stat t={t} label="투자 원금" value={`₩${fmtM(last.cost)}`} />
                  <Stat t={t} label="원금 대비 손익" value={`${gain >= 0 ? "+" : "-"}₩${fmtM(Math.abs(gain))} (${pct(gainPct)})`} color={gain >= 0 ? t.up : t.down} />
                </div>
              );
            })()}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 10, color: t.textFaint }}>
              <span>{histChart.length}일치 기록</span>
              <span>최저 ₩{fmtM(Math.min(...histChart.map(h => h.value)))} · 최고 ₩{fmtM(Math.max(...histChart.map(h => h.value)))}</span>
            </div>
          </>
        )}
      </div>

      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, marginBottom: 14, fontWeight: 600 }}>전체 투자원금 vs 현재 평가액</div>
        {[
          { label: "투자 원금", value: totalAllCost, color: t.textMuted },
          { label: "현재 평가액", value: totalAllEval, color: totalAllEval >= totalAllCost ? t.up : t.down },
        ].map((item, i) => {
          const pctW = totalAllCost > 0 ? Math.min((item.value / totalAllCost) * 100, 120) : 100;
          return (
            <div key={i} style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 11, color: t.textSub }}>{item.label}</span>
                <span style={{ fontSize: 12, fontWeight: 700, color: item.color }}>₩{fmt(item.value)}</span>
              </div>
              <div style={{ height: 8, background: t.inputBg, borderRadius: 4, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(pctW, 100)}%`, background: item.color, borderRadius: 4, opacity: 0.85 }} />
              </div>
            </div>
          );
        })}
        <div style={{ marginTop: 8, fontSize: 11, color: totalAllEval >= totalAllCost ? t.up : t.down, fontWeight: 700, textAlign: "right" }}>
          {totalAllEval >= totalAllCost ? "▲" : "▼"} ₩{fmt(Math.abs(totalAllEval - totalAllCost))} ({pct(totalAllCost > 0 ? ((totalAllEval - totalAllCost) / totalAllCost) * 100 : 0)})
        </div>
      </div>

      <div style={{ background: t.card, borderRadius: 12, padding: 16, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, marginBottom: 12, fontWeight: 600 }}>전체 자산배분 (3계좌 통합)</div>
        {pieData.length === 0 ? (
          <div style={{ fontSize: 11, color: t.textFaint, textAlign: "center", padding: 20 }}>아직 매수 내역이 없어요</div>
        ) : (
          <div style={{ display: "flex", alignItems: "center" }}>
            <SimpleDonut data={pieData} colors={pieColors} size={120} />
            <div style={{ flex: 1, paddingLeft: 12 }}>
              {pieData.map((p, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <div style={{ width: 8, height: 8, borderRadius: 2, background: pieColors[i] }} />
                    <span style={{ fontSize: 10, color: t.textSub }}>{p.name}</span>
                    {p.acct !== "DC" && <span style={{ fontSize: 8, color: t.textFaint, background: t.inputBg, padding: "1px 4px", borderRadius: 3 }}>{p.acct}</span>}
                  </div>
                  <span style={{ fontSize: 10, color: "#60A5FA", fontWeight: 600 }}>
                    {((p.value / (totalAllEval || 1)) * 100).toFixed(1)}%
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  포트폴리오
// ════════════════════════════════════════════════════════════════
function Portfolio({ t, data, totalValue, apiUrl, runAction }) {
  const [editing, setEditing] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [form, setForm] = useState({ units: "", avg_cost: "" });
  const [saving, setSaving] = useState(false);

  const portfolio = data.portfolio || [];

  const openEdit = (p) => { setEditing(p.ticker); setExpanded(p.ticker); setForm({ units: p.units, avg_cost: p.avg_cost }); };

  const save = async (ticker) => {
    setSaving(true);
    const ok = await runAction("updateHoldings", { ticker, units: form.units, avg_cost: form.avg_cost }, "보유현황 업데이트됨");
    setSaving(false);
    if (ok) setEditing(null);
  };

  return (
    <div style={{ padding: 16 }}>
      <div style={{ marginBottom: 14 }}>
        <span style={{ fontSize: 14, fontWeight: 700, color: t.text }}>보유 상품 ({portfolio.length})</span>
      </div>

      {portfolio.map((p, i) => {
        const isParking = p.is_parking === true || p.is_parking === "TRUE";
        const ret = Number(p.profit_rate) || 0;
        const actualRatio = (Number(p.actual_ratio) || 0) * 100;
        const targetRatio = (Number(p.target_ratio) || 0) * 100;
        const diff = actualRatio - targetRatio;
        const isEditing = editing === p.ticker;
        const isOpen = expanded === p.ticker;

        return (
          <div key={p.ticker} style={{ background: t.card, borderRadius: 12, marginBottom: 8, border: `1px solid ${t.border}`, overflow: "hidden" }}>
            <div onClick={() => setExpanded(isOpen ? null : p.ticker)}
              style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", cursor: "pointer" }}>
              <div style={{ width: 3, height: 32, borderRadius: 2, background: isParking ? t.textFaint : DC_SHADES[i % DC_SHADES.length], flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: t.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</span>
                  {isParking && <span style={{ fontSize: 9, color: t.textFaint, border: `1px solid ${t.border}`, padding: "0 4px", borderRadius: 3, flexShrink: 0 }}>대기</span>}
                </div>
                <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>
                  {fmt(p.units)}주 · {actualRatio.toFixed(1)}%
                  {!isParking && <span style={{ color: Math.abs(diff) > 5 ? "#F59E0B" : t.textFaint }}> / 목표 {targetRatio.toFixed(0)}%</span>}
                </div>
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: t.text, fontVariantNumeric: "tabular-nums" }}>₩{fmtM(p.eval_amount)}</div>
                <div style={{ fontSize: 11, color: ret >= 0 ? t.up : t.down, fontVariantNumeric: "tabular-nums" }}>{pct(ret)}</div>
              </div>
              <span style={{ fontSize: 13, color: t.textFaint, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.2s", flexShrink: 0 }}>›</span>
            </div>

            {isOpen && (
            <div style={{ padding: "0 14px 14px", borderTop: `1px solid ${t.border}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 12 }}>
              <span style={{ fontSize: 10, color: t.textFaint }}>{p.ticker} · 현재가 ₩{fmt(p.current_price)}</span>
              <button onClick={(e) => { e.stopPropagation(); openEdit(p); }} style={{ ...btnStyle(t.border), padding: "4px 10px", fontSize: 10, color: t.text }}>수정</button>
            </div>

            {isEditing && (
              <div style={{ marginTop: 10, padding: 10, background: t.inputBg, borderRadius: 8 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                  <div>
                    <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>보유 수량</div>
                    <input type="number" value={form.units} onChange={e => setForm(f => ({ ...f, units: e.target.value }))} style={inputStyle(t)} />
                  </div>
                  <div>
                    <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>평균 매입단가</div>
                    <input type="number" value={form.avg_cost} onChange={e => setForm(f => ({ ...f, avg_cost: e.target.value }))} style={inputStyle(t)} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => save(p.ticker)} disabled={saving} style={btnStyle("#10B981")}>{saving ? "저장 중..." : "저장"}</button>
                  <button onClick={() => setEditing(null)} style={btnStyle("#475569")}>취소</button>
                </div>
              </div>
            )}

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 12 }}>
              <Stat t={t} label="평가액" value={`₩${fmtM(p.eval_amount)}`} />
              <Stat t={t} label="평가손익" value={`${Number(p.profit_amount) >= 0 ? "+" : "-"}₩${fmtM(Math.abs(Number(p.profit_amount) || 0))}`} color={Number(p.profit_amount) >= 0 ? t.up : t.down} />
              <Stat t={t} label="수익률" value={pct(ret)} color={ret >= 0 ? t.up : t.down} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
              <Stat t={t} label="보유수량 / 평단" value={`${fmt(p.units)}주 · ₩${fmt(p.avg_cost)}`} />
              <Stat t={t} label="현재/목표 비중" value={`${actualRatio.toFixed(1)}% / ${targetRatio.toFixed(0)}%`} color={Math.abs(diff) > 5 && !isParking ? "#F59E0B" : t.textSub} />
            </div>
            {Math.abs(diff) > 5 && !isParking && (() => {
              const targetAmount = totalValue * (targetRatio / 100);
              const gapAmount = targetAmount - Number(p.eval_amount);
              const price = Number(p.current_price) || 0;
              const shares = price > 0 ? Math.abs(Math.round(gapAmount / price)) : 0;
              const isBuy = gapAmount > 0;
              if (shares === 0) return null;
              return (
                <div style={{ marginTop: 10, padding: "8px 10px", background: t.inputBg, borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 10, color: t.textMuted }}>목표 비중까지 {diff > 0 ? "+" : ""}{diff.toFixed(1)}%p</span>
                  <span style={{ fontSize: 11, color: t.textSub, fontWeight: 600 }}>{isBuy ? "매수" : "매도"} {fmt(shares)}주</span>
                </div>
              );
            })()}
            </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  분할매수
// ════════════════════════════════════════════════════════════════
function DCA({ t, data, apiUrl, runAction }) {
  const [adding, setAdding] = useState(false);
  const [saving, setSaving] = useState(false);
  const [roundDate, setRoundDate] = useState(today());
  // 5종목 한꺼번에: { ticker: { amount, unit_price } }
  const [roundForms, setRoundForms] = useState({});
  // 기여금 매수 기록
  const [contribBuyAdding, setContribBuyAdding] = useState(false);
  const [contribBuyDate, setContribBuyDate] = useState(today());
  const [contribBuyForms, setContribBuyForms] = useState({});
  const setContribBuyField = (ticker, field, value) =>
    setContribBuyForms(prev => ({ ...prev, [ticker]: { ...prev[ticker], [field]: value } }));
  const setRoundField = (ticker, field, value) =>
    setRoundForms(prev => ({ ...prev, [ticker]: { ...prev[ticker], [field]: value } }));

  const dcaAll = data.dca || [];
  // 분할매수와 기여금매수 분리 (source 컬럼 기준, 없으면 분할매수로 간주)
  const isContribBuy = (d) => String(d.source || "").trim() === "기여금매수";
  const dcaSplit = dcaAll.filter(d => !isContribBuy(d));
  const dcaContrib = dcaAll.filter(isContribBuy);
  const dca = dcaSplit;  // 기존 로직은 분할매수 기준 유지
  const summary = data.summary || {};
  const totalDCA = Number(summary.dca_total) || 12;
  const done = Number(summary.dca_done) || 0;  // DC_SUMMARY의 고유 회차 수 기준
  const remaining = totalDCA - done;
  const perRound = Number(summary.dca_per_round_amount) || 0;
  // 누적 집행액: DC_DCA 분할매수 기록을 직접 합산 (시트 dca_used_amount 수식에 의존하지 않음)
  const usedAmountCalc = dcaSplit.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const usedAmount = dcaSplit.length > 0 ? usedAmountCalc : (Number(summary.dca_used_amount) || 0);
  const totalAmount = Number(summary.dca_total) ? (perRound * totalDCA) : 0;

  const realProducts = (data.portfolio || []).filter(p => p.is_parking !== true && p.is_parking !== "TRUE");

  // ── 이번 회차 플래너 계산 ──────────────────────────────────────
  const currentRound = done + 1; // 다음에 진행해야 할 회차
  const thisRoundRecords = dca.filter(d => Number(d.round) === currentRound);

  const plannerRows = realProducts.map(p => {
    const targetRatio = Number(p.target_ratio) || 0;
    const targetAmount = perRound * targetRatio;           // 이번 회차 종목별 목표 매수금액
    const currentPrice = Number(p.current_price) || 0;
    const recommendedUnits = currentPrice > 0 ? Math.floor(targetAmount / currentPrice) : 0;
    const recommendedCost = recommendedUnits * currentPrice; // 정수 주수 기준 실제 소요금액
    const leftover = targetAmount - recommendedCost;          // 단주 자투리

    const record = thisRoundRecords.find(d => d.ticker === p.ticker);
    const isDone = !!record;

    return {
      ticker: p.ticker, name: p.name, targetRatio, targetAmount,
      currentPrice, recommendedUnits, recommendedCost, leftover,
      isDone, actualAmount: record ? Number(record.amount) : 0,
    };
  });

  const plannerDoneCount = plannerRows.filter(r => r.isDone).length;
  const plannerTotalRecommended = plannerRows.reduce((s, r) => s + r.recommendedCost, 0);
  const plannerTotalLeftover = plannerRows.reduce((s, r) => s + r.leftover, 0);

  // ── 기여금 매수 가이드 계산 ──────────────────────────────────────
  const companyContributions = (data.contribution || [])
    .filter(c => c.type === "회사부담금")
    .sort((a, b) => String(b.date).localeCompare(String(a.date))); // 최신순

  const [selectedContribIdx, setSelectedContribIdx] = useState(0);
  const selectedContrib = companyContributions[selectedContribIdx];

  const contribGuideRows = selectedContrib ? realProducts.map(p => {
    const targetRatio = Number(p.target_ratio) || 0;
    const targetAmount = Number(selectedContrib.amount) * targetRatio;
    const currentPrice = Number(p.current_price) || 0;
    const recommendedUnits = currentPrice > 0 ? Math.floor(targetAmount / currentPrice) : 0;
    const recommendedCost = recommendedUnits * currentPrice;
    const leftover = targetAmount - recommendedCost;
    return { ticker: p.ticker, name: p.name, targetRatio, targetAmount, currentPrice, recommendedUnits, recommendedCost, leftover };
  }) : [];

  const contribTotalRecommended = contribGuideRows.reduce((s, r) => s + r.recommendedCost, 0);
  const contribTotalLeftover = contribGuideRows.reduce((s, r) => s + r.leftover, 0);

  const addRound = async () => {
    const entries = realProducts.filter(p => {
      const f = roundForms[p.ticker];
      return f && Number(f.units) > 0 && Number(f.unit_price) > 0;
    });
    if (entries.length === 0) return;
    setSaving(true);
    for (const p of entries) {
      const f = roundForms[p.ticker];
      const units = Number(f.units);
      const unitPrice = Number(f.unit_price);
      const amount = Math.round(units * unitPrice);
      await runAction("addDca", {
        date: roundDate,
        ticker: p.ticker,
        name: p.name,
        amount,
        unit_price: unitPrice,
        units,
        memo: `${currentRound}회차`,
        round: currentRound,
      }, null);
      // 포트폴리오 보유현황도 자동 업데이트
      const existing = (data.portfolio || []).find(port => port.ticker === p.ticker);
      const prevUnits = Number(existing?.units) || 0;
      const prevCost = Number(existing?.avg_cost) || 0;
      const newUnits = prevUnits + units;
      const newAvgCost = newUnits > 0
        ? Math.round((prevUnits * prevCost + amount) / newUnits)
        : unitPrice;
      await runAction("updateHoldings", {
        ticker: p.ticker, units: newUnits, avg_cost: newAvgCost
      }, null);
    }
    setSaving(false);
    setAdding(false);
    setRoundForms({});
    setRoundDate(today());
  };

  const addContribBuy = async () => {
    const entries = realProducts.filter(p => {
      const f = contribBuyForms[p.ticker];
      return f && Number(f.units) > 0 && Number(f.unit_price) > 0;
    });
    if (entries.length === 0) return;
    setSaving(true);
    for (const p of entries) {
      const f = contribBuyForms[p.ticker];
      const u = Number(f.units);
      const up = Number(f.unit_price);
      const amt = Math.round(u * up);
      await runAction("addDca", {
        date: contribBuyDate, ticker: p.ticker, name: p.name,
        amount: amt, unit_price: up, units: u,
        memo: "회사 기여금 매수", source: "기여금매수",
      }, null);
      // 포트폴리오 보유현황 반영
      const existing = (data.portfolio || []).find(x => x.ticker === p.ticker);
      const pu = Number(existing?.units) || 0;
      const pc = Number(existing?.avg_cost) || 0;
      const nu = pu + u;
      const nc = nu > 0 ? Math.round((pu * pc + amt) / nu) : up;
      await runAction("updateHoldings", { ticker: p.ticker, units: nu, avg_cost: nc }, null);
    }
    setSaving(false);
    setContribBuyAdding(false);
    setContribBuyForms({});
    setContribBuyDate(today());
  };

  const del = async (row, label) => {
    if (!window.confirm(`${label || "이 기록"}을(를) 삭제하시겠습니까?\n삭제 후 되돌릴 수 없습니다.`)) return;
    await runAction("deleteRow", { sheetName: "DC_DCA", row }, "삭제되었습니다");
  };

  const barData = Array.from({ length: totalDCA }, (_, i) => ({
    round: `${i + 1}`,
    // 회차 내 전 종목 합계 (기존: 첫 번째 종목 금액만 표시되던 문제 수정)
    done: dca.filter(d => Number(d.round) === i + 1).reduce((s, d) => s + (Number(d.amount) || 0), 0),
    plan: perRound,
  }));

  return (
    <div style={{ padding: 16 }}>
      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 10 }}>6개월 {totalDCA}회 분할매수 현황</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
          <Stat t={t} label="완료" value={`${done}회`} color="#34D399" />
          <Stat t={t} label="잔여" value={`${remaining}회`} color="#F59E0B" />
          <Stat t={t} label="1회당" value={`₩${fmtM(perRound)}`} />
        </div>
        <div style={{ height: 8, background: t.inputBg, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(done / totalDCA) * 100}%`, background: t.textSub, borderRadius: 4, transition: "width 0.5s" }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
          <span style={{ fontSize: 10, color: t.textFaint }}>누적 집행 ₩{fmt(usedAmount)}</span>
          {totalAmount > 0 && <span style={{ fontSize: 10, color: t.textFaint }}>계획 ₩{fmt(totalAmount)}</span>}
        </div>
      </div>

      {/* ── 이번 회차 플래너 ────────────────────────────────────── */}
      {remaining > 0 && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#60A5FA" }}>{currentRound}회차 매수 플래너</span>
            <span style={{ fontSize: 11, color: t.textMuted }}>{plannerDoneCount}/{plannerRows.length}종목 완료</span>
          </div>
          <div style={{ fontSize: 10, color: t.textFaint, marginBottom: 10 }}>
            머니마켓 ETF 매도 재원 기준 · 현재가로 계산된 추천 수량입니다
          </div>

          {plannerRows.map((r, i) => (
            <div key={r.ticker} style={{
              background: t.inputBg, borderRadius: 8, padding: 10, marginBottom: 8,
              border: r.isDone ? "1px solid #34D39940" : `1px solid ${t.border}`,
              opacity: r.isDone ? 0.7 : 1,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <div style={{ width: 8, height: 8, borderRadius: 2, background: COLORS[i % COLORS.length] }} />
                  <span style={{ fontSize: 12, fontWeight: 600, color: t.text }}>{r.name}</span>
                  {r.isDone && <span style={{ fontSize: 9, color: "#34D399" }}>✓ 완료</span>}
                </div>
                <span style={{ fontSize: 10, color: t.textFaint }}>목표 {(r.targetRatio * 100).toFixed(0)}%</span>
              </div>

              {r.isDone ? (
                <div style={{ fontSize: 11, color: t.textSub, marginTop: 6 }}>
                  실제 매수 ₩{fmt(r.actualAmount)}
                </div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginTop: 8 }}>
                  <Stat t={t} label="목표금액" value={`₩${fmtM(r.targetAmount)}`} />
                  <Stat t={t} label="현재가" value={`₩${fmt(r.currentPrice)}`} />
                  <Stat t={t} label="추천수량" value={`${r.recommendedUnits}주`} color="#60A5FA" />
                </div>
              )}
            </div>
          ))}

          <div style={{ marginTop: 4, padding: "8px 10px", background: t.inputBg, borderRadius: 8, fontSize: 10, color: t.textSub, lineHeight: 1.6 }}>
            추천 수량 합계 매수금액 <span style={{ color: t.text, fontWeight: 700 }}>₩{fmt(plannerTotalRecommended)}</span>
            {plannerTotalLeftover > 0 && (
              <> · 단주 자투리(현금 잔류 예상) <span style={{ color: "#F59E0B", fontWeight: 700 }}>₩{fmt(plannerTotalLeftover)}</span></>
            )}
          </div>
        </div>
      )}

      {remaining === 0 && (
        <div style={{ background: "#064E3B", borderRadius: 12, padding: 16, marginBottom: 12, textAlign: "center" }}>
          <span style={{ fontSize: 12, color: "#34D399", fontWeight: 700 }}>🎉 12회 분할매수 전부 완료되었습니다!</span>
        </div>
      )}

      {/* ── 회사 기여금 매수 가이드 ──────────────────────────────── */}
      {companyContributions.length > 0 && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: "1px solid #10B98140" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#34D399", marginBottom: 4 }}>회사 기여금 매수 가이드</div>
          <div style={{ fontSize: 10, color: t.textFaint, marginBottom: 10 }}>
            선택한 입금액을 목표 비중대로 나누어 추천 수량을 계산합니다
          </div>

          <div style={{ marginBottom: 10 }}>
            <select
              value={selectedContribIdx}
              onChange={e => setSelectedContribIdx(Number(e.target.value))}
              style={inputStyle(t)}
            >
              {companyContributions.map((c, i) => (
                <option key={i} value={i}>{fmtDate(c.date)} · ₩{fmt(c.amount)} {c.memo ? `(${c.memo})` : ""}</option>
              ))}
            </select>
          </div>

          {contribGuideRows.map((r, i) => (
            <div key={r.ticker} style={{ background: t.inputBg, borderRadius: 8, padding: 10, marginBottom: 8, border: `1px solid ${t.border}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <div style={{ width: 8, height: 8, borderRadius: 2, background: COLORS[i % COLORS.length] }} />
                  <span style={{ fontSize: 12, fontWeight: 600, color: t.text }}>{r.name}</span>
                </div>
                <span style={{ fontSize: 10, color: t.textFaint }}>목표 {(r.targetRatio * 100).toFixed(0)}%</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginTop: 8 }}>
                <Stat t={t} label="배분금액" value={`₩${fmtM(r.targetAmount)}`} />
                <Stat t={t} label="현재가" value={`₩${fmt(r.currentPrice)}`} />
                <Stat t={t} label="추천수량" value={`${r.recommendedUnits}주`} color="#34D399" />
              </div>
            </div>
          ))}

          <div style={{ marginTop: 4, padding: "8px 10px", background: t.inputBg, borderRadius: 8, fontSize: 10, color: t.textSub, lineHeight: 1.6 }}>
            추천 수량 합계 매수금액 <span style={{ color: t.text, fontWeight: 700 }}>₩{fmt(contribTotalRecommended)}</span>
            {contribTotalLeftover > 0 && (
              <> · 단주 자투리 <span style={{ color: "#F59E0B", fontWeight: 700 }}>₩{fmt(contribTotalLeftover)}</span></>
            )}
          </div>

          {/* 기여금 매수 기록 */}
          <button onClick={() => setContribBuyAdding(true)}
            style={{ ...btnStyle("#10B981"), width: "100%", marginTop: 10, padding: "9px 0" }}>
            + 기여금으로 매수한 내역 기록
          </button>

          {contribBuyAdding && (
            <div style={{ marginTop: 10, padding: 12, background: t.inputBg, borderRadius: 8, border: `1px solid ${t.border}` }}>
              <div style={{ fontSize: 11, color: "#34D399", fontWeight: 700, marginBottom: 10 }}>
                기여금 매수 기록 (회차에 포함되지 않음)
              </div>
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>매수일</div>
                <input type="date" value={contribBuyDate} onChange={e => setContribBuyDate(e.target.value)} style={inputStyle(t)} />
              </div>
              {realProducts.map((p, i) => {
                const f = contribBuyForms[p.ticker] || {};
                return (
                  <div key={p.ticker} style={{ background: t.card, borderRadius: 8, padding: 10, marginBottom: 8, border: `1px solid ${t.border}` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2, background: DC_SHADES[i % DC_SHADES.length] }} />
                      <span style={{ fontSize: 12, fontWeight: 600, color: t.text }}>{p.name}</span>
                      <span style={{ fontSize: 10, color: t.textFaint, marginLeft: "auto" }}>₩{fmt(p.current_price)}</span>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      <div>
                        <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>수량 (주)</div>
                        <input type="number" value={f.units || ""} placeholder="0"
                          onChange={e => setContribBuyField(p.ticker, "units", e.target.value)} style={inputStyle(t)} />
                      </div>
                      <div>
                        <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>체결단가</div>
                        <input type="number" value={f.unit_price || ""} placeholder={fmt(p.current_price)}
                          onChange={e => setContribBuyField(p.ticker, "unit_price", e.target.value)} style={inputStyle(t)} />
                      </div>
                    </div>
                    {f.units && f.unit_price && (
                      <div style={{ fontSize: 10, color: "#34D399", marginTop: 4 }}>
                        → ₩{fmt(Math.round(Number(f.units) * Number(f.unit_price)))}
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ fontSize: 11, color: t.textSub, marginBottom: 10 }}>
                총 매수금액 <span style={{ color: t.text, fontWeight: 700 }}>
                  ₩{fmt(Object.values(contribBuyForms).reduce((s, f) =>
                    s + (f.units && f.unit_price ? Math.round(Number(f.units) * Number(f.unit_price)) : 0), 0))}
                </span>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={addContribBuy} disabled={saving} style={btnStyle("#10B981")}>
                  {saving ? "저장 중..." : "저장"}
                </button>
                <button onClick={() => { setContribBuyAdding(false); setContribBuyForms({}); }} style={btnStyle("#475569")}>취소</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 8 }}>회차별 집행 현황</div>
        <SimpleLineChart
          data={barData}
          lines={[
            { key: "done", label: "집행", color: "#3B82F6" },
            { key: "plan", label: "계획", color: t.border, dashed: true },
          ]}
          height={100}
          formatY={v => v > 0 ? `₩${fmt(v)}` : "미집행"}
          t={t}
        />
      </div>

      {/* ── 회차별 계획 vs 실제 서머리 ────────────────────────────── */}
      {done > 0 && (() => {
        const roundNums = [...new Set(dca.map(d => Number(d.round)))].sort((a,b) => a-b);
        return (
          <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
            <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 10 }}>회차별 계획 vs 실제</div>
            <div style={{ display: "grid", gridTemplateColumns: "44px 1fr 1fr 84px", gap: 6, paddingBottom: 6, borderBottom: `1px solid ${t.border}` }}>
              <span style={{ fontSize: 10, color: t.textFaint }}>회차</span>
              <span style={{ fontSize: 10, color: t.textFaint, textAlign: "right" }}>계획</span>
              <span style={{ fontSize: 10, color: t.textFaint, textAlign: "right" }}>실제</span>
              <span style={{ fontSize: 10, color: t.textFaint, textAlign: "right" }}>차이</span>
            </div>
            {roundNums.map(r => {
              const roundRows = dca.filter(d => Number(d.round) === r);
              const actual = roundRows.reduce((s, d) => s + Number(d.amount), 0);
              const diff = actual - perRound;
              return (
                <div key={r} style={{ display: "grid", gridTemplateColumns: "44px 1fr 1fr 84px", alignItems: "center", gap: 6, padding: "9px 0", borderBottom: `1px solid ${t.border}` }}>
                  <span style={{ fontSize: 12, color: t.textSub }}>{r}회차</span>
                  <span style={{ fontSize: 11, color: t.textFaint, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>₩{fmt(perRound)}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: t.text, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>₩{fmt(actual)}</span>
                  <span style={{ fontSize: 11, color: diff >= 0 ? t.up : t.down, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                    {diff >= 0 ? "+" : "−"}{fmt(Math.abs(diff))}
                  </span>
                </div>
              );
            })}

    </div>
  );
}

function Contributions({ t, data, apiUrl, runAction }) {
  const [adding, setAdding] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ date: today(), type: "회사부담금", amount: "", memo: "" });

  const contributions = data.contribution || [];
  const company = contributions.filter(c => c.type === "회사부담금").reduce((s, c) => s + Number(c.amount), 0);
  const personal = contributions.filter(c => c.type === "추가납입").reduce((s, c) => s + Number(c.amount), 0);

  const add = async () => {
    if (!form.amount) return;
    setSaving(true);
    const ok = await runAction("addContribution", form, "납입 기록 추가됨");
    setSaving(false);
    if (ok) { setAdding(false); setForm({ date: today(), type: "회사부담금", amount: "", memo: "" }); }

    return runAction("deleteRow", { sheetName: "DC_CONTRIBUTION", row }, "삭제되었습니다");

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>

          <div style={{ fontSize: 18, fontWeight: 800, color: "#60A5FA", marginTop: 4 }}>₩{fmtM(company)}</div>
          <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>연 1~2회 입금</div>
        </div>
        <div style={{ background: t.card, borderRadius: 12, padding: 14, border: `1px solid ${t.border}` }}>
          <div style={{ fontSize: 10, color: t.textMuted }}>추가납입</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: "#34D399", marginTop: 4 }}>₩{fmtM(personal)}</div>
          <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>자체 납입</div>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: t.text }}>납입 내역</span>
        <button onClick={() => setAdding(true)} style={btnStyle("#3B82F6")}>+ 납입 기록</button>

          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>구분</div>
            <select value={form.type} onChange={e => setForm(p => ({ ...p, type: e.target.value }))} style={inputStyle(t)}>
              <option>회사부담금</option>
              <option>추가납입</option>
            </select>
          </div>
          {[
            { label: "날짜", key: "date", type: "date" },
            { label: "금액 (원)", key: "amount", type: "number" },
            { label: "메모", key: "memo", type: "text" },

            <div key={f.key} style={{ marginBottom: 8 }}>

              <input type={f.type} value={form[f.key]} onChange={e => setForm(p => ({ ...p, [f.key]: e.target.value }))} style={inputStyle(t)} />
