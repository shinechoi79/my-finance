// ════════════════════════════════════════════════════════════════
//  배당금
// ════════════════════════════════════════════════════════════════
function Dividends({ t, data, apiUrl, runAction }) {
  const [adding, setAdding] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ date: today(), ticker: "", name: "", amount: "", memo: "" });

  const dividends = data.dividend || [];
  const total = dividends.reduce((s, d) => s + Number(d.amount), 0);
  const realProducts = (data.portfolio || []).filter(p => p.is_parking !== true && p.is_parking !== "TRUE");

  const selectProduct = (ticker) => {
    const p = realProducts.find(x => x.ticker === ticker);
    setForm(f => ({ ...f, ticker, name: p?.name || "" }));
  };

  const add = async () => {
    if (!form.amount || !form.ticker) return;
    setSaving(true);
    const ok = await runAction("addDividend", form, "배당 기록 추가됨");
    setSaving(false);
    if (ok) { setAdding(false); setForm({ date: today(), ticker: "", name: "", amount: "", memo: "" }); }
  };

  const del = async (row, label) => {
    if (!window.confirm(`${label || "이 기록"}을(를) 삭제하시겠습니까?\n삭제 후 되돌릴 수 없습니다.`)) return;
    return runAction("deleteRow", { sheetName: "DC_DIVIDEND", row }, "삭제되었습니다");
  };

  const byMonth = {};
  dividends.forEach(d => { const m = fmtDate(d.date).slice(0, 7); byMonth[m] = (byMonth[m] || 0) + Number(d.amount); });
  const chartData = Object.entries(byMonth).sort().map(([m, v]) => ({ month: m.slice(5) + "월", amount: v }));

  return (
    <div style={{ padding: 16 }}>
      <div style={{ background: "linear-gradient(135deg, #064E3B, #065F46)", borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: "#6EE7B7", marginBottom: 4 }}>누적 배당금 수령</div>
        <div style={{ fontSize: 28, fontWeight: 800, color: "#34D399" }}>₩{fmt(total)}</div>
        <div style={{ fontSize: 11, color: "#6EE7B7", marginTop: 4 }}>{dividends.length}건 수령</div>
      </div>

      {chartData.length > 0 && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
          <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 8 }}>월별 배당금</div>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 80, padding: "0 4px" }}>
            {chartData.map((d, i) => {
              const maxVal = Math.max(...chartData.map(x => x.amount), 1);
              const barH = Math.max((d.amount / maxVal) * 60, 8);
              return (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <span style={{ fontSize: 9, color: "#10B981", fontWeight: 600 }}>₩{fmtM(d.amount)}</span>
                  <div style={{ width: "100%", height: barH, background: "#10B981", borderRadius: "4px 4px 0 0", opacity: 0.8 }} />
                  <span style={{ fontSize: 10, color: t.textFaint }}>{d.month}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: t.text }}>배당금 내역</span>
        <button onClick={() => setAdding(true)} style={btnStyle("#10B981")}>+ 배당 기록</button>
      </div>

      {adding && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: "1px solid #10B981" }}>
          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>종목 선택</div>
            <select value={form.ticker} onChange={e => selectProduct(e.target.value)} style={inputStyle(t)}>
              <option value="">선택하세요</option>
              {realProducts.map(p => <option key={p.ticker} value={p.ticker}>{p.name}</option>)}
            </select>
          </div>
          {[
            { label: "날짜", key: "date", type: "date" },
            { label: "배당금액 (원)", key: "amount", type: "number" },
            { label: "메모", key: "memo", type: "text" },
          ].map(f => (
            <div key={f.key} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>{f.label}</div>
              <input type={f.type} value={form[f.key]} onChange={e => setForm(p => ({ ...p, [f.key]: e.target.value }))} style={inputStyle(t)} />
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={add} disabled={saving} style={btnStyle("#10B981")}>{saving ? "저장 중..." : "저장"}</button>
            <button onClick={() => setAdding(false)} style={btnStyle("#475569")}>취소</button>
          </div>
        </div>
      )}

      {[...dividends].sort((a, b) => String(b.date).localeCompare(String(a.date))).map(d => (
        <div key={d._row} style={{ background: t.card, borderRadius: 10, padding: 12, marginBottom: 8, border: `1px solid ${t.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: t.text }}>{d.name}</div>
            <div style={{ fontSize: 10, color: t.textMuted, marginTop: 2 }}>{fmtDate(d.date)} {d.memo && `· ${d.memo}`}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 15, fontWeight: 800, color: "#34D399" }}>+₩{fmt(d.amount)}</span>
            <button onClick={() => del(d._row, `${d.name} 배당 ₩${fmt(d.amount)}`)} style={{ ...btnStyle("#7F1D1D"), padding: "3px 8px", fontSize: 9 }}>삭제</button>
          </div>
        </div>
      ))}
    </div>
  );
}


// ════════════════════════════════════════════════════════════════
//  연금저축 / IRP 계좌 화면 (onlyAccount로 단일 계좌 표시)
// ════════════════════════════════════════════════════════════════
function PensionAccounts({ t, data, apiUrl, runAction, showToast, onlyAccount }) {
  const pension = data?.pension;
  const pAccts = pension?.accounts || [];
  const rawSavings = pAccts.find(a => a.account === "연금저축");
  const rawIrp = pAccts.find(a => a.account === "개인형IRP");
  // 필드명 매핑 (monthly_deposit → monthly_contribution)
  const savingsAll = rawSavings ? { ...rawSavings, monthly_contribution: rawSavings.monthly_deposit } : null;
  const irpAll = rawIrp ? { ...rawIrp, monthly_contribution: rawIrp.monthly_deposit } : null;
  // onlyAccount 지정 시 해당 계좌만 표시
  const savings = (!onlyAccount || onlyAccount === "연금저축") ? savingsAll : null;
  const irp = (!onlyAccount || onlyAccount === "개인형IRP") ? irpAll : null;
  const allDeposits = pension?.deposits || [];
  const contributions = onlyAccount
    ? allDeposits.filter(d => d.account === onlyAccount)
    : allDeposits;

  const [adding, setAdding] = useState(false);
  const [saving, setSaving] = useState(false);
  const [editAccount, setEditAccount] = useState(null);
  const [editForm, setEditForm] = useState({ units: "", avg_cost: "" });
  const [contribForm, setContribForm] = useState({ date: today(), account: onlyAccount || "연금저축", amount: "", memo: "" });
  const [tradeAdding, setTradeAdding] = useState(false);
  // 총급여 구간은 연금저축/IRP 공통 설정 → localStorage로 공유
  const [taxHighIncome, setTaxHighIncomeState] = useState(() => localStorage.getItem("dc_tax_high_income") === "true");
  const setTaxHighIncome = (v) => {
    localStorage.setItem("dc_tax_high_income", String(v));
    setTaxHighIncomeState(v);
  };
  const [tradeForm, setTradeForm] = useState({ date: today(), account: onlyAccount || "연금저축", units: "", unit_price: "", memo: "" });
  const allTrades = pension?.trades || [];
  const trades = onlyAccount ? allTrades.filter(x => x.account === onlyAccount) : allTrades;

  const addTrade = async () => {
    if (!tradeForm.units || !tradeForm.unit_price) return;
    setSaving(true);
    try {
      await postAction(apiUrl, "addPensionTrade", tradeForm);
      showToast("매수 기록 추가됨 (보유현황 자동 반영)");
      setTimeout(() => { window.location.reload(); }, 2000);
    } catch(e) { showToast(e.message, "error"); }
    setSaving(false);
    setTradeAdding(false);
    setTradeForm({ date: today(), account: onlyAccount || "연금저축", units: "", unit_price: "", memo: "" });
  };

  const totalEval = (Number(savings?.eval_amount) || 0) + (Number(irp?.eval_amount) || 0);
  const totalCost = (Number(savings?.purchase_cost) || 0) + (Number(irp?.purchase_cost) || 0);
  const totalProfit = totalEval - totalCost;
  const totalReturn = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;
  const monthlyTotal = (Number(savings?.monthly_contribution) || 0) + (Number(irp?.monthly_contribution) || 0);

  const addContrib = async () => {
    if (!contribForm.amount) return;
    setSaving(true);
    try {
      await postAction(apiUrl, "addDeposit", contribForm);
      showToast("납입 기록 추가됨");
      setTimeout(() => { window.location.reload(); }, 2000);
    } catch(e) { showToast(e.message, "error"); }
    setSaving(false);
    setAdding(false);
    setContribForm({ date: today(), account: "연금저축", amount: "", memo: "" });
  };

  const saveHoldings = async () => {
    if (!editAccount) return;
    setSaving(true);
    try {
      await postAction(apiUrl, "updatePension", {
        account: editAccount, units: editForm.units, avg_cost: editForm.avg_cost
      });
      showToast("보유현황 업데이트됨");
      setTimeout(() => { window.location.reload(); }, 2000);
    } catch(e) { showToast(e.message, "error"); }
    setSaving(false);
    setEditAccount(null);
  };

  const AccountCard = ({ label, acct, color }) => {
    if (!acct) return null;
    const ret = Number(acct.profit_rate) || 0;
    const isEdit = editAccount === label;
    return (
      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div>
            <span style={{ fontSize: 10, color, fontWeight: 700, background: color + "20", padding: "2px 8px", borderRadius: 4 }}>{label}</span>
            <div style={{ fontSize: 13, fontWeight: 700, color: t.text, marginTop: 4 }}>{acct.name}</div>
          </div>
          <button onClick={() => { setEditAccount(label); setEditForm({ units: acct.units, avg_cost: acct.avg_cost }); }}
            style={{ ...btnStyle(t.border), padding: "4px 10px", fontSize: 10, color: t.text }}>수정</button>
        </div>

        {isEdit && (
          <div style={{ background: t.inputBg, borderRadius: 8, padding: 10, marginBottom: 10 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>보유 수량 (주)</div>
                <input type="number" value={editForm.units} onChange={e => setEditForm(f => ({ ...f, units: e.target.value }))} style={inputStyle(t)} />
              </div>
              <div>
                <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>평균 매입단가</div>
                <input type="number" value={editForm.avg_cost} onChange={e => setEditForm(f => ({ ...f, avg_cost: e.target.value }))} style={inputStyle(t)} />
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={saveHoldings} disabled={saving} style={btnStyle("#10B981")}>{saving ? "저장 중..." : "저장"}</button>
              <button onClick={() => setEditAccount(null)} style={btnStyle("#475569")}>취소</button>
            </div>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
          <Stat t={t} label="평가액" value={`₩${fmtM(acct.eval_amount)}`} />
          <Stat t={t} label="수익률" value={pct(ret)} color={ret >= 0 ? t.up : t.down} />
          <Stat t={t} label="보유수량" value={`${Number(acct.units)}주`} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
          <Stat t={t} label="매입단가" value={`₩${fmt(acct.avg_cost)}`} />
          <Stat t={t} label="현재가" value={`₩${fmt(acct.current_price)}`} />
        </div>
        <div style={{ marginTop: 8, fontSize: 11, color: ret >= 0 ? t.up : t.down, fontWeight: 700 }}>
          평가손익 {ret >= 0 ? "+" : ""}₩{fmt(acct.profit_amount)}
        </div>
      </div>
    );
  };

  return (
    <div style={{ padding: 16 }}>
      {/* 합산 요약 */}
      <div style={{ background: "linear-gradient(135deg, #1E3A5F, #0F172A)", borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ fontSize: 11, color: "#94A3B8", marginBottom: 4 }}>{onlyAccount || "연금저축 + IRP 합산"}</div>
        <div style={{ fontSize: 24, fontWeight: 800, color: "#F8FAFC" }}>₩{fmt(totalEval)}</div>
        <div style={{ fontSize: 12, color: totalProfit >= 0 ? t.up : t.down, marginTop: 4 }}>
          {totalProfit >= 0 ? "▲" : "▼"} ₩{fmt(Math.abs(totalProfit))} ({pct(totalReturn)})
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
          <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 8, padding: 8 }}>
            <div style={{ fontSize: 9, color: "#94A3B8" }}>투자원금</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#F8FAFC" }}>₩{fmtM(totalCost)}</div>
          </div>
          <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 8, padding: 8 }}>
            <div style={{ fontSize: 9, color: "#94A3B8" }}>{onlyAccount ? "월 납입" : "월 납입 합계"}</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#60A5FA" }}>₩{fmt(monthlyTotal)}</div>
          </div>
        </div>
      </div>

      {/* 세액공제 환급 예상 */}
      {(() => {
        const ps = pension?.summary || {};
        const thisYear = new Date().getFullYear();
        // 올해 납입액 = 별도 납입기록 + 매수금액 (자동이체 후 즉시 매수 패턴)
        // 날짜 문자열에서 연도만 직접 추출 (타임존 변환 영향 제거)
        const yearOf = (d) => Number(String(fmtDate(d)).slice(0, 4));
        const ytdOf = (acctName) => {
          const dep = allDeposits
            .filter(d => d.account === acctName && yearOf(d.date) === thisYear)
            .reduce((s, d) => s + (Number(d.amount) || 0), 0);
          const tr = allTrades
            .filter(x => x.account === acctName && yearOf(x.date) === thisYear)
            .reduce((s, x) => s + (Number(x.amount) || 0), 0);
          return dep + tr;
        };
        const savingYtd = ytdOf("연금저축");
        const irpYtd = ytdOf("개인형IRP");
        const usedYtd = onlyAccount === "연금저축" ? savingYtd
                      : onlyAccount === "개인형IRP" ? irpYtd
                      : savingYtd + irpYtd;
        // 연금저축 한도 600만, IRP 포함 총 900만
        const limit = onlyAccount === "연금저축" ? 6000000
                    : onlyAccount === "개인형IRP" ? 3000000
                    : 9000000;
        const remain = Math.max(0, limit - usedYtd);
        const pctUsed = Math.min(100, (usedYtd / limit) * 100);
        // 세액공제율: 총급여 5,500만원 이하 16.5%, 초과 13.2%
        const [highIncome, setHighIncome] = [taxHighIncome, setTaxHighIncome];
        const rate = highIncome ? 0.132 : 0.165;
        const refund = Math.round(usedYtd * rate);
        const maxRefund = Math.round(limit * rate);

        return (
          <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: `1px solid ${t.border}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <span style={{ fontSize: 13, color: t.textSub, fontWeight: 600 }}>올해 세액공제 현황</span>
              <button onClick={() => setTaxHighIncome(!highIncome)}
                title="연금저축·IRP 공통 적용됩니다"
                style={{ ...btnStyle(t.border), padding: "3px 8px", fontSize: 9, color: t.text }}>
                {highIncome ? "총급여 5,500만↑" : "총급여 5,500만↓"}
              </button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
              <div style={{ background: t.inputBg, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>예상 환급액</div>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#10B981" }}>₩{fmt(refund)}</div>
                <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>공제율 {(rate*100).toFixed(1)}%</div>
              </div>
              <div style={{ background: t.inputBg, borderRadius: 8, padding: 10 }}>
                <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>한도 채우면</div>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#F59E0B" }}>₩{fmt(maxRefund)}</div>
                <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>+₩{fmt(maxRefund - refund)} 더</div>
              </div>
            </div>

            <div style={{ height: 8, background: t.inputBg, borderRadius: 4, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ height: "100%", width: `${pctUsed}%`, background: "#7F77DD", borderRadius: 4, transition: "width 0.5s" }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: t.textFaint }}>
              <span>납입 ₩{fmt(usedYtd)}</span>
              <span>한도 ₩{fmt(limit)} · 잔여 ₩{fmt(remain)}</span>
            </div>
            {remain > 0 && (
              <div style={{ marginTop: 8, padding: "6px 10px", background: t.inputBg, borderRadius: 6, fontSize: 10, color: t.textSub }}>
                연말까지 ₩{fmt(remain)} 더 납입하면 ₩{fmt(Math.round(remain * rate))} 추가 환급
              </div>
            )}
            <div style={{ marginTop: 6, fontSize: 10, color: t.textFaint }}>
              ※ 매수 기록 금액을 납입액으로 집계합니다 ({thisYear}년 기준)<br />
              ※ 총급여 구간은 연금저축·IRP에 공통 적용됩니다
            </div>
          </div>
        );
      })()}

      {/* 계좌별 카드 */}
      <AccountCard label="연금저축" acct={savings} color="#8B5CF6" />
      <AccountCard label="IRP" acct={irp} color="#F59E0B" />

      {/* 매수 내역 */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: t.text }}>매수 내역</span>
        <button onClick={() => setTradeAdding(true)} style={btnStyle("#7B1FA2")}>+ 매수 기록</button>
      </div>

      {tradeAdding && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: "1px solid #7B1FA2" }}>
          <div style={{ fontSize: 12, color: "#A855F7", fontWeight: 700, marginBottom: 10 }}>매수 기록 추가</div>
          {!onlyAccount && (
            <div style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>계좌 구분</div>
              <select value={tradeForm.account} onChange={e => setTradeForm(p => ({ ...p, account: e.target.value }))} style={inputStyle(t)}>
                <option>연금저축</option>
                <option>개인형IRP</option>
              </select>
            </div>
          )}
          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>매수일</div>
            <input type="date" value={tradeForm.date} onChange={e => setTradeForm(p => ({ ...p, date: e.target.value }))} style={inputStyle(t)} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>매수 수량 (주)</div>
              <input type="number" value={tradeForm.units} placeholder="0"
                onChange={e => setTradeForm(p => ({ ...p, units: e.target.value }))} style={inputStyle(t)} />
            </div>
            <div>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>체결단가 (원)</div>
              <input type="number" value={tradeForm.unit_price} placeholder="0"
                onChange={e => setTradeForm(p => ({ ...p, unit_price: e.target.value }))} style={inputStyle(t)} />
            </div>
          </div>
          {tradeForm.units && tradeForm.unit_price && (
            <div style={{ fontSize: 11, color: "#34D399", marginBottom: 8 }}>
              → 매수금액 ₩{fmt(Math.round(Number(tradeForm.units) * Number(tradeForm.unit_price)))}
            </div>
          )}
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>메모</div>
            <input type="text" value={tradeForm.memo} onChange={e => setTradeForm(p => ({ ...p, memo: e.target.value }))} style={inputStyle(t)} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={addTrade} disabled={saving} style={btnStyle("#10B981")}>{saving ? "저장 중..." : "저장"}</button>
            <button onClick={() => setTradeAdding(false)} style={btnStyle("#475569")}>취소</button>
          </div>
        </div>
      )}

      {trades.length === 0 && !tradeAdding && (
        <div style={{ background: t.card, borderRadius: 10, padding: 16, marginBottom: 14, border: `1px solid ${t.border}`, textAlign: "center", fontSize: 11, color: t.textFaint }}>
          아직 매수 기록이 없어요
        </div>
      )}

      {[...trades].sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 20).map((tr, i) => (
        <div key={i} style={{ background: t.card, borderRadius: 10, padding: 12, marginBottom: 8, border: `1px solid ${t.border}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 10, color: "#A855F7", fontWeight: 700 }}>{tr.account}</div>
              <div style={{ fontSize: 11, color: t.textMuted, marginTop: 2 }}>{fmtDate(tr.date)} {tr.memo && `· ${tr.memo}`}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 14, fontWeight: 800, color: t.text }}>₩{fmt(tr.amount)}</div>
              <div style={{ fontSize: 10, color: t.textFaint }}>{fmt(tr.unit_price)}원 × {Math.round(Number(tr.units))}주</div>
            </div>
          </div>
        </div>
      ))}

      {/* 납입 내역 */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, marginTop: 20 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: t.text }}>납입 내역</span>
        <button onClick={() => setAdding(true)} style={btnStyle("#8B5CF6")}>+ 납입 기록</button>
      </div>

      {adding && (
        <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 12, border: "1px solid #8B5CF6" }}>
          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>계좌 구분</div>
            <select value={contribForm.account} onChange={e => setContribForm(f => ({ ...f, account: e.target.value }))} style={inputStyle(t)}>
              <option>연금저축</option>
              <option>IRP</option>
            </select>
          </div>
          {[
            { label: "날짜", key: "date", type: "date" },
            { label: "납입금액 (원)", key: "amount", type: "number" },
            { label: "메모", key: "memo", type: "text" },
          ].map(f => (
            <div key={f.key} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: t.textMuted, marginBottom: 3 }}>{f.label}</div>
              <input type={f.type} value={contribForm[f.key]} onChange={e => setContribForm(p => ({ ...p, [f.key]: e.target.value }))} style={inputStyle(t)} />
            </div>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={addContrib} disabled={saving} style={btnStyle("#10B981")}>{saving ? "저장 중..." : "저장"}</button>
            <button onClick={() => setAdding(false)} style={btnStyle("#475569")}>취소</button>
          </div>
        </div>
      )}

      {[...contributions].sort((a, b) => String(b.date).localeCompare(String(a.date))).map((c, i) => (
        <div key={i} style={{ background: t.card, borderRadius: 10, padding: 12, marginBottom: 8, border: `1px solid ${t.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 10, color: c.account === "연금저축" ? "#8B5CF6" : "#F59E0B", fontWeight: 700 }}>{c.account}</div>
            <div style={{ fontSize: 11, color: t.textMuted, marginTop: 2 }}>{fmtDate(c.date)} {c.memo && `· ${c.memo}`}</div>
          </div>
          <span style={{ fontSize: 15, fontWeight: 800, color: t.text }}>₩{fmt(c.amount)}</span>
        </div>
      ))}

      {pension === null && (
        <div style={{ padding: 20, textAlign: "center", color: t.textFaint, fontSize: 12 }}>
          ⚠️ 연금 데이터를 불러오지 못했어요.<br/>Apps Script에 pension API가 추가됐는지 확인해주세요.
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  은퇴 시뮬레이터
// ════════════════════════════════════════════════════════════════
function Simulator({ t, data, totalValue, apiUrl, runAction, showToast }) {
  const config = data.config || {};
  const [currentAge, setCurrentAge] = useState(Number(config.current_age) || 45);
  const [targetAge, setTargetAge] = useState(Number(config.target_age) || 55);
  const [expectedReturn, setExpectedReturn] = useState(Number(config.expected_return) || 5);
  const [saving, setSaving] = useState(false);

  const years = Math.max(1, targetAge - currentAge);
  const clampedYears = Math.min(years, 10);

  // 보수적/적극적은 중립(슬라이더) 기준 ±3%p로 연동 (기존: 3% / 8% 고정이라 중립과 겹치거나 역전되던 문제 수정)
  const SCENARIO_SPREAD = 3;
  const scenarios = [
    { label: "보수적", rate: Math.max(0, expectedReturn - SCENARIO_SPREAD), color: "#60A5FA" },
    { label: "중립", rate: expectedReturn, color: "#34D399" },
    { label: "적극적", rate: expectedReturn + SCENARIO_SPREAD, color: "#F59E0B" },
  ];

  const calcFV = (rate) => totalValue * Math.pow(1 + rate / 100, clampedYears);

  const chartData = Array.from({ length: clampedYears + 1 }, (_, i) => {
    const row = { year: i === 0 ? "현재" : `${i}년` };
    scenarios.forEach(s => { row[s.label] = Math.round(totalValue * Math.pow(1 + s.rate / 100, i)); });
    return row;
  });

  const saveConfig = async (key, value) => {
    setSaving(true);
    try {
      await postAction(apiUrl, "updateConfig", { key, value });
      showToast("설정 저장됨");
    } catch (e) {
      showToast(e.message, "error");
    }
    setSaving(false);
  };

  return (
    <div style={{ padding: 16 }}>
      <div style={{ background: t.card, borderRadius: 12, padding: 16, marginBottom: 14, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 12 }}>시뮬레이터 설정</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div>
            <div style={{ fontSize: 11, color: t.textMuted, marginBottom: 4 }}>현재 나이</div>
            <input type="number" value={currentAge} onChange={e => setCurrentAge(+e.target.value)}
              onBlur={() => saveConfig("current_age", currentAge)}
              style={{ ...inputStyle(t), textAlign: "center" }} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: t.textMuted, marginBottom: 4 }}>목표 은퇴 나이</div>
            <input type="number" value={targetAge} onChange={e => setTargetAge(Math.min(+e.target.value, currentAge + 10))}
              onBlur={() => saveConfig("target_age", targetAge)}
              style={{ ...inputStyle(t), textAlign: "center" }} />
          </div>
        </div>
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: t.textMuted, marginBottom: 4 }}>
            <span>기대 수익률 (중립 시나리오)</span>
            <span style={{ color: "#34D399", fontWeight: 700 }}>{expectedReturn}%</span>
          </div>
          <input type="range" min={1} max={15} step={0.5} value={expectedReturn}
            onChange={e => setExpectedReturn(+e.target.value)}
            onMouseUp={() => saveConfig("expected_return", expectedReturn)}
            onTouchEnd={() => saveConfig("expected_return", expectedReturn)}
            style={{ width: "100%", accentColor: "#34D399" }} />
        </div>
        <div style={{ marginTop: 10, padding: "8px 10px", background: t.inputBg, borderRadius: 8, fontSize: 11, color: t.textSub }}>
          시뮬레이션 기간: <span style={{ color: "#60A5FA", fontWeight: 700 }}>{clampedYears}년</span> (최대 10년 적용)
          {saving && <span style={{ marginLeft: 8, color: t.textFaint }}>· 저장 중...</span>}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
        {scenarios.map(s => (
          <div key={s.label} style={{ background: t.card, borderRadius: 12, padding: 12, border: `1px solid ${s.color}30`, textAlign: "center" }}>
            <div style={{ fontSize: 10, color: s.color, fontWeight: 700, marginBottom: 4 }}>{s.label} {s.rate}%</div>
            <div style={{ fontSize: 13, fontWeight: 800, color: t.text }}>₩{fmtM(calcFV(s.rate))}</div>
            <div style={{ fontSize: 10, color: t.textFaint, marginTop: 2 }}>{clampedYears}년 후</div>
          </div>
        ))}
      </div>

      <div style={{ background: t.card, borderRadius: 12, padding: 14, border: `1px solid ${t.border}` }}>
        <div style={{ fontSize: 13, color: t.textSub, fontWeight: 600, marginBottom: 12 }}>복리 성장 시나리오 비교</div>
        <SimpleLineChart
          data={chartData}
          lines={scenarios.map(s => ({ key: s.label, label: s.label, color: s.color }))}
          height={200}
          formatY={v => `₩${fmt(v)}`}
          t={t}
          showLegend={true}
        />
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  공통 컴포넌트 & 스타일
// ════════════════════════════════════════════════════════════════
function Stat({ t, label, value, color }) {
  return (
    <div>
      <div style={{ fontSize: 9, color: t.textMuted, marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 12, fontWeight: 700, color: color || t.text }}>{value}</div>
    </div>
  );
}

const inputStyle = (t) => ({
  width: "100%", background: t.inputBg, border: `1px solid ${t.border}`,
  borderRadius: 8, padding: "8px 10px", color: t.text, fontSize: 12,
  outline: "none", boxSizing: "border-box",
});
